<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NOTE4 · 天气</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#efeee9;color:#222;font:15px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}main{max-width:1020px;margin:56px auto;padding:0 24px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:32px}h1{font-size:30px;font-weight:500;margin:0 0 8px}.muted{color:#777;font-size:13px}.layout{display:grid;grid-template-columns:1.4fr 1fr;gap:32px}.screen{background:#fff;border-radius:6px;padding:16px;box-shadow:0 8px 40px #0000000c}.screen img{width:100%;display:block;aspect-ratio:4/3}.caption{display:flex;justify-content:space-between;margin-top:14px;color:#777;font-size:12px}nav{display:flex;gap:6px;flex-wrap:wrap;margin:22px 0}button{cursor:pointer;border:1px solid #d4d3cd;background:#f9f9f6;border-radius:6px;padding:10px 15px;color:#333;font:inherit}button.active,button.primary{background:#292e2c;color:white;border-color:#292e2c}button:disabled{opacity:.45;cursor:default}section{background:#f9f9f6;border:1px solid #deded5;border-radius:8px;padding:24px;margin-bottom:16px}h2{font-size:14px;font-weight:500;margin:0 0 20px}dl{margin:0}dl div{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid #e7e7df}dt{color:#777}dd{margin:0;text-align:right}.actions{display:flex;gap:8px;margin-top:20px;flex-wrap:wrap}#error{color:#9e452e;line-height:1.6;white-space:pre-wrap}.help{line-height:1.9;font-size:13px;color:#777;margin-top:24px}a{color:inherit}@media(max-width:720px){main{margin:28px auto}.layout{grid-template-columns:1fr}.caption{font-size:11px}header{align-items:flex-start}h1{font-size:25px}}
</style>
<main><header><div><h1 id="city-title">天气</h1><div class="muted">NOTE4 · 天气</div></div><span id="connection">正在读取…</span></header>
<div class="layout"><div><div class="screen"><img id="preview" src="/preview.png" alt="NOTE4 页面预览"></div><div class="caption"><span>400 × 300 · 连续灰度源图</span><span>设备端使用十六灰</span></div>
<nav><button data-action="home">主屏</button><button data-action="details">天气总览</button></nav>
<div class="actions"><button data-action="up">↑ 上一页</button><button data-action="confirm">确认</button><button data-action="down">↓ 下一页</button></div>
<p class="help">上下键或确认键切换天气页；长按上键回首页，长按下键进入总览。长按确认使用固件录音，本应用尚未接入语音识别。</p></div>
<div><section><h2>局域网显示</h2><dl><div><dt>目标</dt><dd id="target">—</dd></div><div><dt>最近显示完成</dt><dd id="displayed">—</dd></div><div><dt>设备电量</dt><dd id="battery">—</dd></div><div><dt>显示模式</dt><dd id="palette">十六灰 · 待连接</dd></div></dl><div class="actions"><button class="primary" data-action="connect">连接设备</button><button data-action="disconnect">断开</button><button id="retry" data-action="retry_display" hidden>重试显示</button></div></section>
<section><h2>天气数据</h2><dl><div><dt>来源</dt><dd><a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a> · <a href="https://creativecommons.org/licenses/by/4.0/">CC BY 4.0</a> · 模型天气</dd></div><div><dt>数据时间</dt><dd id="freshness">—</dd></div><div><dt>更新节奏</dt><dd>天气每小时 · 无分钟刷新</dd></div></dl><div class="actions"><button data-action="refresh">更新天气</button></div></section><p id="error" role="status"></p><div class="help">界面预览与实屏灰阶可能不同。主机需保持运行和局域网连接，设备需开启“待机保持 Wi-Fi”。</div></div></div></main>
<script>
const $=s=>document.querySelector(s);let revision='';

async function refresh(){try{let r=await fetch('/api/state');if(!r.ok)throw Error();let s=await r.json();$('#city-title').textContent=s.city+' · 天气';$('#connection').textContent=s.connection+(s.recording?' · 录音中':'');$('#target').textContent=s.target;$('#displayed').textContent=s.displayed_at?new Date(s.displayed_at).toLocaleTimeString('zh-CN',{hour12:false}):'尚未显示';$('#battery').textContent=s.status?.battery_percent!=null?s.status.battery_percent+'%':'未知';$('#palette').textContent=s.gray16?'十六灰 · 已读取设备色板':'十六灰 · 待连接';$('#freshness').textContent=s.freshness+(s.fetching?' · 正在取数':'');$('#error').textContent=[s.weather_error,s.error].filter(Boolean).join('\n');$('#retry').hidden=!s.display_blocked;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.action===s.page));let key=s.revision;if(key!==revision){revision=key;$('#preview').src='/preview.png?t='+Date.now()}document.querySelector('[data-action=connect]').disabled=['已连接','正在连接','正在关闭'].includes(s.connection);document.querySelector('[data-action=disconnect]').disabled=!['已连接','正在连接'].includes(s.connection)}catch(e){$('#connection').textContent='本机服务已停止'}}
document.querySelectorAll('button[data-action]').forEach(b=>b.onclick=async()=>{try{let r=await fetch('/api/action',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:b.dataset.action})});if(!r.ok)throw Error();revision='';setTimeout(refresh,300)}catch(e){$('#error').textContent='操作未提交，请检查本机服务'}});refresh();setInterval(refresh,2000);
</script></html>
