name: Shanghai Disneyland queue monitor

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: read

concurrency:
  group: shanghai-disney-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Check Shanghai Disneyland queue feed
        run: python3 experiments/shanghai_disney_monitor.py
      - name: Upload time-stamped evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: disney-queue-sample-${{ github.run_id }}
          path: disney-probe-output/
          retention-days: 7
          if-no-files-found: warn
