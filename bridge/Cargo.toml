[package]
name = "note4-weather-bridge"
version = "0.1.0"
edition = "2021"

[dependencies]
zectrix-sdk = { path = "../vendor/zectrix-local-push-sdk" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "io-std", "signal"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
